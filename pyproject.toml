[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2rl-drone-training"
version = "0.1.0"
description = "JAX/Crazyflow PPO training stack for autonomous FPV racing drones."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "crazyflow==0.1.0",
    "jax>=0.4.30",
    "numpy>=1.26",
]

[project.scripts]
a2rl-drone-train = "a2rl_drone_training.train:main"
a2rl-drone-plan = "a2rl_drone_training.hierarchical.cli:plan_main"
a2rl-drone-evaluate = "a2rl_drone_training.hierarchical.cli:evaluate_main"

[project.optional-dependencies]
planning = ["casadi>=3.7", "scipy>=1.15"]
visualization = ["matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
